<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifikasi Keamanan</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#192339;background:#f2f5fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top left,#e2eaff,transparent 55%),#f2f5fc}.card{background:#fff;border-radius:22px;box-shadow:0 20px 65px #23355720;max-width:440px;width:100%;padding:34px 28px;text-align:center}.shield{font-size:35px;background:#e8f1ff;color:#1769e0;border-radius:50%;width:70px;height:70px;display:grid;place-items:center;margin:0 auto 18px}h1{font-size:27px;margin:0 0 10px}p{color:#5c687c;line-height:1.55}.target{background:#f5f8ff;border:1px solid #dfe7f5;border-radius:12px;padding:14px;margin:20px 0;text-align:left;overflow-wrap:anywhere}.target small{color:#5c687c}.target a{display:block;color:#1559bf;font-weight:650;margin-top:5px}button{background:#1769e0;border:0;border-radius:12px;padding:15px 20px;color:white;font-size:16px;font-weight:700;width:100%;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#status{min-height:24px;font-size:14px}.legal{font-size:12px;color:#69758a}.legal a{color:#1769e0}
</style>
</head>
<body><main class="card"><div class="shield">✓</div><h1>Verifikasi keamanan</h1><p>Untuk melanjutkan, lakukan pemeriksaan keamanan singkat. Setelah berhasil, Anda akan diarahkan ke website yang tercantum di bawah.</p><div class="target"><small>Website tujuan:</small><a id="destination" href="https://kitabisa.s.gy/BXIxgw" rel="noopener noreferrer">https://kitabisa.s.gy/BXIxgw</a></div><button id="verify" type="button">Verifikasi &amp; Melanjutkan</button><p id="status" role="status" aria-live="polite"></p><div class="legal">Dilindungi Google reCAPTCHA. Berlaku <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">Kebijakan Privasi</a> dan <a href="https://policies.google.com/terms" target="_blank" rel="noopener noreferrer">Persyaratan Layanan</a> Google.</div></main>
<script>
const btn=document.getElementById('verify'),status=document.getElementById('status'),link=document.getElementById('destination');
let cfg=null;
function show(message){status.textContent=message}
function loadRecaptcha(siteKey){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://www.google.com/recaptcha/api.js?render='+encodeURIComponent(siteKey);s.onload=resolve;s.onerror=()=>reject(new Error('Gagal memuat Google reCAPTCHA.'));document.head.appendChild(s)})}
async function init(){try{const r=await fetch('/api/config',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.message||'Konfigurasi tidak tersedia');cfg=d;link.href=d.destination;link.textContent=d.destination;await loadRecaptcha(d.siteKey)}catch(e){btn.disabled=true;show(e.message)}}
btn.addEventListener('click',async()=>{if(!cfg)return;btn.disabled=true;show('Memverifikasi...');try{const token=await new Promise((resolve,reject)=>{grecaptcha.ready(()=>grecaptcha.execute(cfg.siteKey,{action:'continue'}).then(resolve,reject))});const r=await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Verifikasi gagal');if(d.redirect!==cfg.destination)throw new Error('Alamat tujuan tidak sesuai');show('Berhasil. Mengalihkan...');window.location.assign(cfg.destination)}catch(e){show(e.message||'Terjadi kesalahan. Silakan coba lagi.');btn.disabled=false}});
init();
</script></body></html>
